<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makasih Ya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(to bottom, #090d16, #1e1b4b, #311042);
      overflow: hidden;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
    }
    .font-cursive {
      font-family: 'Sacramento', cursive;
    }

    /* Bintang melayang bebas */
    .star {
      position: absolute;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(244, 114, 182, 0.5);
      pointer-events: none;
      animation: floatStar linear infinite, pulseGlow 3s ease-in-out infinite alternate;
    }

    @keyframes floatStar {
      0% {
        transform: translate(0, 0) scale(0.8);
      }
      25% {
        transform: translate(120px, -80px) scale(1.2);
      }
      50% {
        transform: translate(-100px, -180px) scale(0.9);
      }
      75% {
        transform: translate(-150px, 100px) scale(1.1);
      }
      100% {
        transform: translate(0, 0) scale(0.8);
      }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Bunga melayang dan berputar bebas */
    .floating-flower {
      position: absolute;
      user-select: none;
      pointer-events: none;
      font-size: 2.5rem;
      filter: drop-shadow(0 0 12px rgba(244, 114, 182, 0.6));
      animation: floatFlower linear infinite;
    }

    @keyframes floatFlower {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(0.9);
      }
      20% {
        transform: translate(150px, -120px) rotate(90deg) scale(1.1);
      }
      40% {
        transform: translate(80px, -250px) rotate(180deg) scale(1);
      }
      60% {
        transform: translate(-120px, -150px) rotate(270deg) scale(1.2);
      }
      80% {
        transform: translate(-90px, 80px) rotate(320deg) scale(0.95);
      }
      100% {
        transform: translate(0, 0) rotate(360deg) scale(0.9);
      }
    }

    /* Efek kilau teks */
    .glow-text {
      text-shadow: 0 0 20px rgba(244, 114, 182, 0.8), 0 0 40px rgba(192, 132, 252, 0.6);
    }
  </style>
</head>
<body class="flex items-center justify-center relative">

  <!-- Audio Musik Latar -->
  <audio id="bg-music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
  </audio>

  <!-- Container Elemen Bergerak -->
  <div id="stars-container" class="absolute inset-0 overflow-hidden pointer-events-none"></div>
  <div id="flowers-container" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

  <!-- Teks Utama di Tengah -->
  <main class="relative z-10 text-center px-4">
    <h1 class="font-cursive text-6xl md:text-8xl lg:text-9xl font-bold text-pink-200 glow-text tracking-wide transition-all duration-700">
      makasihhh yaa
    </h1>
    <p class="text-pink-200/60 text-xs md:text-sm mt-6 tracking-widest uppercase font-light">
      ( klik di mana saja untuk memutar musik ✨ )
    </p>
  </main>

  <script>
    const music = document.getElementById('bg-music');
    let isPlaying = false;

    // Memutar musik saat layar diklik pertama kali
    function startMusic() {
      if (!isPlaying) {
        music.play().then(() => {
          isPlaying = true;
        }).catch(err => console.log(err));
      }
    }
    document.body.addEventListener('click', startMusic, { once: true });

    // Membuat bintang bergerak ke mana-mana
    const starsContainer = document.getElementById('stars-container');
    const totalStars = 50;

    for (let i = 0; i < totalStars; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      
      const size = Math.random() * 4 + 2;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}vw`;
      star.style.top = `${Math.random() * 100}vh`;
      
      const duration = Math.random() * 12 + 8;
      const delay = Math.random() * 5;
      star.style.animationDuration = `${duration}s, ${Math.random() * 2 + 2}s`;
      star.style.animationDelay = `${delay}s, ${delay}s`;

      starsContainer.appendChild(star);
    }

    // Membuat bunga melayang dan bergerak berterbangan
    const flowersContainer = document.getElementById('flowers-container');
    const flowerIcons = ['🌸', '🌺', '🌷', '🌻', '🌹', '🌼'];
    const totalFlowers = 35;

    for (let i = 0; i < totalFlowers; i++) {
      const flower = document.createElement('div');
      flower.className = 'floating-flower';
      flower.innerText = flowerIcons[Math.floor(Math.random() * flowerIcons.length)];

      flower.style.left = `${Math.random() * 90 + 5}vw`;
      flower.style.top = `${Math.random() * 90 + 5}vh`;

      const fontSize = Math.random() * 1.8 + 1.5;
      flower.style.fontSize = `${fontSize}rem`;

      const duration = Math.random() * 16 + 10;
      const delay = Math.random() * 6;
      flower.style.animationDuration = `${duration}s`;
      flower.style.animationDelay = `-${delay}s`;

      flowersContainer.appendChild(flower);
    }
  </script>
</body>
</html>
