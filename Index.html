<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You <3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a0514;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #1a0514;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="flowerCanvas" width="600" height="700"></canvas>

    <script>
        const canvas = document.getElementById("flowerCanvas");
        const ctx = canvas.getContext("2d");

        // Pindahkan titik pusat koordinat (0,0) ke tengah canvas
        ctx.translate(canvas.width / 2, canvas.height / 2 - 20);

        const WORD = "my love";

        // Fungsi menggambar kelopak bunga dari deretan teks
        function drawPetal(bx, by, baseAngleRad, length, width, color, points = 26) {
            ctx.fillStyle = color;
            ctx.font = "bold 8px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const cosA = Math.cos(baseAngleRad);
            const sinA = Math.sin(baseAngleRad);

            for (let i = 0; i <= points; i++) {
                const theta = (i * Math.PI) / points;
                const out = length * Math.sin(theta);
                const side = width * Math.sin(theta) * Math.cos(theta);
                const rx = out * cosA - side * sinA;
                const ry = out * sinA + side * cosA;

                ctx.fillText(WORD, bx + rx, -(by + ry));
            }
        }

        // Fungsi menggambar daun
        function drawLeaf(bx, by, angleDeg, length, width) {
            drawPetal(bx, by, (angleDeg * Math.PI) / 180, length, width, "#2e8b57", 22);
        }

        // Simulasi pergerakan melengkung batang (Turtle circle)
        let tx = 0, ty = -30, heading = (260 * Math.PI) / 180;

        function drawStemArc(radius, extentDeg) {
            ctx.strokeStyle = "#2e8b57";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(tx, -ty);

            const steps = Math.abs(extentDeg) * 2;
            const stepAngle = ((extentDeg / steps) * Math.PI) / 180;
            const stepDist = (2 * Math.PI * radius * (Math.abs(extentDeg) / 360)) / steps;

            for (let s = 0; s < steps; s++) {
                tx += Math.cos(heading) * stepDist;
                ty += Math.sin(heading) * stepDist;
                heading += stepAngle;
                ctx.lineTo(tx, -ty);
            }
            ctx.stroke();
            return { x: tx, y: ty };
        }

        // 1. Gambar Batang dan Daun
        const pos1 = drawStemArc(250, 25);
        drawLeaf(pos1.x, pos1.y, 160, 50, 25);

        drawStemArc(250, 20);
        const pos2 = { x: tx, y: ty };
        drawLeaf(pos2.x, pos2.y, 20, 55, 28);

        drawStemArc(250, 30);

        // 2. Gambar Ring Kelopak Bunga
        const rings = [
            { radius: 0, count: 4, length: 40, width: 15, color: "#ffe6f2", offset: 45 },
            { radius: 10, count: 5, length: 50, width: 25, color: "#ffb3d9", offset: 0 },
            { radius: 20, count: 7, length: 70, width: 35, color: "#ff66b2", offset: 30 },
            { radius: 30, count: 9, length: 90, width: 45, color: "#ff1493", offset: 15 },
            { radius: 40, count: 12, length: 110, width: 55, color: "#c71585", offset: 0 },
        ];

        for (const ring of rings) {
            for (let i = 0; i < ring.count; i++) {
                const angle = (360 / ring.count) * i + ring.offset;
                const rad = (angle * Math.PI) / 180;
                const bx = ring.radius * Math.cos(rad);
                const by = ring.radius * Math.sin(rad);

                drawPetal(bx, by, rad, ring.length, ring.width, ring.color);
            }
        }

        // 3. Simbol Hati Melayang
        ctx.fillStyle = "#ff99cc";
        ctx.font = "bold 12px Courier";
        for (let i = 0; i < 12; i++) {
            const x = (Math.random() - 0.5) * 500;
            const y = (Math.random() - 0.5) * 500;
            if (Math.hypot(x, y) > 130) {
                ctx.fillText("<3", x, -y);
            }
        }

        // 4. Teks Penutup Interactive
        ctx.fillStyle = "white";
        ctx.font = "italic 11px Arial";
        ctx.fillText("Klik di mana saja untuk menambah <3", 0, 310);

        // Efek Interaktif: Klik untuk menambah hati
        canvas.addEventListener("click", (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left - canvas.width / 2;
            const clickY = e.clientY - rect.top - (canvas.height / 2 - 20);

            ctx.fillStyle = "#ff99cc";
            ctx.font = "bold 14px Courier";
            ctx.fillText("<3", clickX, clickY);
        });
    </script>
</body>
</html>
